agent = "claude-code"
model = "claude/sonnet"
mode = "review"
timeout = "1h"
activity_timeout = "5m"
fail_on = "high"
fail_check = false
request_changes = false
report_on = "medium"
min_confidence = "medium"
shell = "restricted"
push = "restricted"

[review]
# Legacy remains the migration default but has no safe production local driver.
engine = "legacy"
max_concurrency = 3
overall_timeout = "15m"
incremental = true
sensitive_paths = []

[review.shuvcode]
package = "shuvcode"
# Parseable source baseline only. The approved executable pin is null until a corrected release ships.
version = "1.18.4"
use_user_auth = true

[review.models]
coordinator = "subscription/default-reasoning"
standard = "subscription/default-coding"
light = "subscription/default-fast"

[review.tiers.trivial]
max_lines = 10
max_files = 20
reviewers = ["code-quality"]

[review.tiers.lite]
max_lines = 100
max_files = 20
# The planner chooses one content-aware specialist from performance, documentation, and release.
reviewers = ["code-quality", "tests", "performance", "documentation", "release"]

[review.tiers.full]
reviewers = ["code-quality", "security", "performance", "tests", "documentation", "release"]

[paths]
include = ["**/*"]
ignore = []

[shell_sandbox]
allow_commands = []
deny_commands = ["sudo", "su", "docker", "podman"]

[fix_ci]
max_attempts = 3
max_runtime = "90m"
rerun_checks = true

[memory]
enabled = false
backend = "github"
learnings = false
pr_summaries = true
