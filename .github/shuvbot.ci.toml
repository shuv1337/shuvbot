# shuvbot's configuration when it reviews this repository from GitHub Actions.
#
# Deliberately separate from any root shuvbot.toml. The local CLI discovers a
# root config automatically, and the only setting that must differ between a
# laptop and a runner is where the review runtime's credential comes from, so
# one shared file would force local review to require a CI secret.

[review]
engine = "coordinator"

[review.shuvcode]
# Must match APPROVED_SHUVCODE_RUNTIME_VERSION and the exact devDependency in
# package.json; a mismatch fails before any review work starts.
version = "2.0.0-alpha-9"
# A runner has no shuvcode profile, so the runtime authenticates from a single
# credential in the job environment (CLAUDE_CODE_OAUTH_TOKEN). Local runs keep
# the "user" default and authenticate from your own shuvcode profile.
auth = "environment"

# Anthropic-only, because environment auth forwards exactly one credential.
# The built-in defaults span three providers - the coordinator is Anthropic but
# specialists are xAI and the light role is OpenAI - which works on a machine
# whose shuvcode profile has all three, and fails every specialist here. The
# first real Action run degraded to 0/6 coverage for exactly this reason.
[review.models]
coordinator = "subscription/claude-opus-5@medium"
# Effort, not the clock, is what a full-tier review is bounded by.
#
# Dogfood #3 (concurrency 3, 5m cap) lost four of six specialists at exactly
# 300s while performance and release finished in 99s and 89s. Dogfood #4 raised
# the cap to 10m and ran all six in one wave, and then *nobody* finished: every
# session burned its full 600s and the run died on the 15m overall timeout
# having written no artifacts at all. Doubling the clock bought nothing, and six
# concurrent sessions on one subscription credential appear to throttle each
# other - even the two reviewers that had been fast.
#
# So the session length is set by how long the model thinks, and @high does not
# converge on a workspace this size. @medium is the lever; if it still does not
# reach quorum the next step is @low, or bounding how much materialised content
# a single reviewer receives.
standard = "subscription/claude-fable-5@medium"
light = "subscription/claude-fable-5@low"
