name: shuvbot

# Manual only. shuvbot reviews when it is explicitly asked to, by mentioning it
# in a comment on a pull request - never automatically on push or on open.
#
# Two comment events, because "commenting on a pull request" is two different
# GitHub events that look like one act from the UI: `issue_comment` is the
# conversation tab, `pull_request_review_comment` is an inline comment on a
# diff line. Subscribing to only one makes the other silently do nothing.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {} # deny by default

# One review at a time per pull request. Not cancel-in-progress: a review
# someone asked for by commenting should finish rather than be replaced.
concurrency:
  group: shuvbot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: shuvbot review
    # Only the repository owner, only an explicit @shuvbot mention, and only on
    # a pull request.
    #
    # `issue_comment` also fires for plain issues, which carry no diff and
    # nothing shuvbot can act on; filtering them here means an unrelated issue
    # comment starts no run at all, rather than starting one that can only fail.
    #
    # `comment.user.login` is set by GitHub and cannot be spoofed, so this is a
    # real gate - but it is the *only* identity gate. The action independently
    # re-checks write access and never checks who the actor is, so do not
    # weaken this line expecting shuvbot to catch it.
    if: >-
      github.event.comment.user.login == 'shuv1337' &&
      contains(github.event.comment.body, '@shuvbot') &&
      (github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    steps:
      # A comment event checks out the default branch, not the pull request, so
      # reviewers would read pre-change files while reviewing a post-change
      # diff. Resolve the merge ref instead - but only for a same-repo head.
      # Checking out a fork here would put untrusted code in a job that holds
      # CLAUDE_CODE_OAUTH_TOKEN, which is the one thing this must never do.
      - name: Resolve pull request ref
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" = "false" ]; then
            echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          else
            echo "Fork pull request: keeping the default checkout. The review will run but shuvbot will refuse to post it." >&2
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Empty is actions/checkout's default (the ref that triggered the run).
          ref: ${{ steps.target.outputs.ref || '' }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      # The coordinator spawns a pinned shuvcode runtime, which has to be
      # installed already: the action bundle is self-contained and never runs a
      # package manager. shuvcode is an exact devDependency of this repository,
      # so the lockfile is the pin and no separate install pin can drift.
      - name: Install the review runtime
        run: bun install --frozen-lockfile

      # The checked-out action, not the published `shuv1337/shuvbot@v0`, so a
      # pull request is reviewed by the shuvbot revision it contains. That is
      # the point of dogfooding here, and it is also required for now because
      # `engine: coordinator` does not exist in the published v0 yet.
      #
      # Caveat: this runs the committed `dist/index.js`, which is regenerated
      # periodically rather than on every source change. A pull request that
      # changes source without `bun run build` is reviewed by the older bundle.
      - name: Run shuvbot
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          engine: coordinator
          # The action does not auto-discover shuvbot.toml the way the CLI does.
          # Without this the coordinator falls back to local-profile auth and
          # refuses to start on a runner.
          config: .github/shuvbot.ci.toml
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Upload shuvbot artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: shuvbot
          path: ${{ runner.temp }}/shuvbot
          if-no-files-found: warn
