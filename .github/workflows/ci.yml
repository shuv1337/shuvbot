name: ci

# Automatic, unlike the shuvbot review workflow. This is ordinary verification,
# not the bot reviewing anything, so it runs on every pull request and on
# master without being asked.
on:
  pull_request:
  push:
    branches: [master]

permissions: {} # deny by default

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; a master run is a record
  # of whether that commit was green, so it is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      # Frozen: a lockfile that does not match package.json is itself a failure,
      # not something to silently resolve differently than a developer would.
      - name: Install
        run: bun install --frozen-lockfile

      # Cheapest signals first, so an obvious break reports in seconds.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Prettier is part of the stated baseline but `lint` is ESLint only, so
      # formatting drifted in four source files before anything noticed.
      - name: Format
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Evals
        run: bun run evals

      - name: Build
        run: bun run build

      # The committed bundle is what GitHub actually executes for a JS action -
      # including shuvbot's own review workflow, which runs `uses: ./`. A stale
      # bundle means a pull request is reviewed by, and consumers run, code that
      # is not the code under review.
      #
      # This is deliberately stricter than the dist-bundle test, which
      # byte-compares `dist/index.js` only. A comment-only source change leaves
      # `index.js` identical while `index.js.map` drifts, and the test passes;
      # this step catches it. Verified by doing exactly that.
      - name: Check dist is current
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is stale. Run 'bun run build' and commit the result (index.js and index.js.map together)."
            exit 1
          fi
